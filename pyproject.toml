[project]
name = "images-to-pptx"
version = "0.1.0"
description = "Скриншоты слайдов по горячей клавише и сборка PPTX"
authors = [
    { name = "1nsanovic", email = "vicbez.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "jeepney>=0.9.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "python-pptx>=1.0.2",
    "python-xlib>=0.33",
]

[project.scripts]
images-to-pptx = "images_to_pptx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/images_to_pptx"]

[tool.hatch.build.targets.wheel.force-include]
"src/images_to_pptx/assets/icon.png" = "images_to_pptx/assets/icon.png"
"src/images_to_pptx/assets/icon.ico" = "images_to_pptx/assets/icon.ico"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
